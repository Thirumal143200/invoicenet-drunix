name: InvoiceNet CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and Build Backend
        run: |
          cd backend
          npm install
          npx tsc --noEmit
      - name: Run Backend Comprehensive Test Suite
        run: |
          cd backend
          npm test

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
